name: discover-models
# Daily scan of Hugging Face for new open-weight LLMs. Runs on GitHub's
# runners (which CAN reach huggingface.co) and opens a PR with new candidates
# for you to review — the PR IS the human-in-the-loop approval step.
on:
  schedule:
    - cron: "0 13 * * *"   # every day, 13:00 UTC
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Pull arena leaderboard
        continue-on-error: true    # arena must never block discovery
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: python scripts/pull_arena.py
      - name: Pull Artificial Analysis scores
        continue-on-error: true    # AA must never block discovery
        run: python scripts/pull_aa.py
      - name: Discover new models
        env:
          # HF_TOKEN unlocks GATED repos, which is the whole point: every
          # meta-llama/* and google/gemma-* repo serves README.md publicly but
          # answers 401 for config.json and tokenizer_config.json, and the
          # API's `config` expand carries no context field for them either.
          # Ten discovered rows sat at context_window: 0 for exactly that
          # reason. The token must belong to an account that has ACCEPTED the
          # Llama and Gemma licence terms — a valid token that has not is
          # still 401 on those repos.
          #
          # It is optional. With no secret set, hf_meta.auth_headers sends no
          # Authorization header at all and those rows simply stay in the
          # review queue, exactly as they do today.
          #
          # HUGGINGFACE_TOKEN is kept because this workflow has passed it for
          # a long time; until hf_meta.auth_headers learned to read it, that
          # secret reached nothing — huggingface_hub only ever looks at
          # HF_TOKEN / HUGGING_FACE_HUB_TOKEN, and the urllib fetchers read no
          # token at all. Either name works now.
          #
          # The `||` fallback matters: huggingface_hub's own get_token() reads
          # ONLY HF_TOKEN / HUGGING_FACE_HUB_TOKEN, so a token supplied under
          # the HUGGINGFACE_TOKEN name would authenticate our urllib fetchers
          # (via auth_headers) but leave HfApi anonymous. Feeding whichever
          # secret exists into HF_TOKEN authenticates both. An absent secret
          # interpolates to "", which get_token() cleans to None and
          # auth_headers skips, so the fallback is safe when neither is set.
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: python scripts/discover.py --min-params 3
      - name: Are there gaps an agent could fill?
        # Bounds the spend and keeps a no-op run free: if nothing in the
        # queue carries either of the two reasons this agent handles, the
        # step below is skipped entirely rather than paying a model to
        # discover there is no work.
        #
        # The key check lives HERE and not in the agent step's own `if`,
        # because a step's own `env:` block is not in scope for its own `if`
        # expression — `env.ANTHROPIC_API_KEY` there reads as empty whether
        # or not the secret is set, which would skip the agent forever. One
        # step, one output, no silent never-runs.
        id: gaps
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          n=$(python scripts/refresh_review.py --count-with \
                moe-active-params-unknown license-not-allowlisted)
          if [ -z "$KEY" ]; then
            echo "no ANTHROPIC_API_KEY secret; skipping enrichment ($n gap(s) left for a human)"
            n=0
          fi
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "$n row(s) with a fillable gap"
      - name: Record models.yaml before the agent runs
        # models.yaml is append-only and owned by discover.py. The agent is
        # told not to touch it; this is what makes that a guarantee rather
        # than an instruction to an LLM. Compared again below.
        id: sealed
        run: echo "sha=$(shasum -a 256 models.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Fill the review gaps a document can answer
        # continue-on-error for the same reason arena and AA have it: this is
        # an enrichment source, and an outage, a rate limit or an empty
        # ANTHROPIC_API_KEY must degrade the run to "discovery without
        # enrichment", never fail it. The queue simply keeps its gaps.
        if: steps.gaps.outputs.count != '0'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Use the fill-review-gaps skill on candidates.yaml.
            Do not commit, do not push, and do not edit models.yaml.
          claude_args: >-
            --allowedTools
            "Read,Edit,Grep,Glob,WebFetch,WebSearch,Bash(python scripts/check_license.py:*),Bash(curl -sSL https://huggingface.co/*)"
      - name: Verify the agent left models.yaml alone
        # A hard stop, not a warning. If this fires the agent wrote to the
        # published index, and the run must not proceed to open a PR
        # containing that write. Deliberately NOT continue-on-error.
        run: |
          now=$(shasum -a 256 models.yaml | cut -d' ' -f1)
          if [ "$now" != "${{ steps.sealed.outputs.sha }}" ]; then
            echo "::error::the agent modified models.yaml, which is off limits"
            exit 1
          fi
      - name: Re-derive needs_review after the agent's edits
        # discover.py wrote needs_review before the agent changed the facts,
        # so without this a row carries a filled params_active_b AND
        # moe-active-params-unknown at once — contradictory, and it hides
        # what is genuinely still outstanding from whoever reads the PR.
        # Preserves the existing `generated:` stamp, so this step alone can
        # never make a run look PR-worthy to pr_gate.py.
        run: python scripts/refresh_review.py --write
      - name: Validate models.yaml
        # discover.py can now append promoted rows straight to models.yaml.
        # classify.py's schema gate should stop anything invalid before it
        # gets here, but running the real CI gate right after discovery turns
        # a gate bug (or a promoted row it didn't anticipate) into a legible
        # validation error in this log, instead of a TypeError deep inside
        # render_readme.py's date sort with no clue what row caused it.
        run: python scripts/validate.py
      - name: Rebuild README and models.json (always, not just on a promotion)
        # This must run unconditionally, every run, whether or not
        # discover.py appended a row: pull_aa.py runs earlier in this same
        # job and can change an AA Index value already in aa_scores.yaml with
        # no new row in models.yaml at all. It cuts the other way too now
        # that aa_join resolves scores at render time — a row promoted this
        # run picks up an AA Index the sidecar already held, so the rendered
        # column moves even when aa_scores.yaml does not. Before this step ran
        # unconditionally, that case opened a PR with a stale README, and
        # validate.yml's `git diff --exit-code README.md` check then failed
        # on every such PR. Re-rendering every run, regardless of what
        # changed upstream, is what keeps README.md always in sync with
        # whatever this job just produced.
        run: |
          python scripts/render_readme.py
          python scripts/render_json.py
      - name: Decide whether this run is worth a PR
        # The stamp in candidates.yaml and the README badge rendering it move
        # on EVERY run by design, so create-pull-request would open a
        # date-bump PR every single day on the daily schedule — a rolling
        # diff shifting under a reviewer mid-review, or seven empty PRs a
        # week. pr_gate.py masks those two lines and asks whether any of the
        # four published files moved for a real reason. It is a tested Python
        # script rather than shell in this file because the failure that
        # matters is the quiet one: over-suppression drops a discovered
        # frontier release with no PR and no error to notice.
        id: worth
        run: |
          # The assignment gets its OWN line, and that is load-bearing.
          # `echo "changed=$(cmd)"` discards cmd's exit status even under
          # GitHub's default `bash -e` shell, so a gate that crashed would
          # write a bare `changed=`, the step would exit 0, and the PR step's
          # `if` would read that as false: a silently suppressed release,
          # which is the exact failure this gate exists to prevent. A bare
          # assignment DOES propagate the substitution's status, so a broken
          # gate fails the job loudly instead of quietly eating the PR.
          changed=$(python scripts/pr_gate.py)
          case "$changed" in
            true|false) ;;
            *) echo "::error::pr_gate.py printed '$changed', expected true or false"
               exit 1 ;;
          esac
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Open PR if there are new candidates
        if: steps.worth.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: refresh discovered model candidates"
          branch: auto/model-candidates
          title: "New open-weight model candidates for review"
          body: |
            Automated discovery.

            **`models.yaml`** — rows auto-promoted because they cleared the
            notability bar with no missing vitals. `commercial_use` on these is
            inferred from the licence tag, not read from the licence: check any
            row rendered with a trailing `?` before merging.

            **`candidates.yaml`** — rows that need a decision. Each carries a
            `needs_review` list saying what is missing. Fill the gap here and the
            next run promotes the row automatically.
          add-paths: |
            models.yaml
            candidates.yaml
            arena_agent_rankings.yaml
            aa_scores.yaml
            README.md
            models.json
          delete-branch: true
