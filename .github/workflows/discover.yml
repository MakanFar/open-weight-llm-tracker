name: discover-models
# Weekly scan of Hugging Face for new open-weight LLMs. Runs on GitHub's
# runners (which CAN reach huggingface.co) and opens a PR with new candidates
# for you to review — the PR IS the human-in-the-loop approval step.
on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Pull arena leaderboard
        continue-on-error: true    # arena must never block discovery
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: python scripts/pull_arena.py
      - name: Pull Artificial Analysis scores
        continue-on-error: true    # AA must never block discovery
        run: python scripts/pull_aa.py
      - name: Discover new models
        env:
          # Optional: add an HF token as a repo secret for higher rate limits.
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: python scripts/discover.py --min-params 3
      - name: Validate models.yaml
        # discover.py can now append promoted rows straight to models.yaml.
        # classify.py's schema gate should stop anything invalid before it
        # gets here, but running the real CI gate right after discovery turns
        # a gate bug (or a promoted row it didn't anticipate) into a legible
        # validation error in this log, instead of a TypeError deep inside
        # render_readme.py's date sort with no clue what row caused it.
        run: python scripts/validate.py
      - name: Rebuild README (always, not just when a row was promoted)
        # This must run unconditionally, every week, whether or not
        # discover.py appended a row: pull_aa.py runs earlier in this same
        # job and can change an AA Index value already in aa_scores.yaml with
        # no new row in models.yaml at all. Before this step ran
        # unconditionally, that case opened a PR with a stale README, and
        # validate.yml's `git diff --exit-code README.md` check then failed
        # on every such PR. Re-rendering every run, regardless of what
        # changed upstream, is what keeps README.md always in sync with
        # whatever this job just produced.
        run: python scripts/render_readme.py
      - name: Open PR if there are new candidates
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: refresh discovered model candidates"
          branch: auto/model-candidates
          title: "New open-weight model candidates for review"
          body: |
            Automated discovery.

            **`models.yaml`** — rows auto-promoted because they cleared the
            notability bar with no missing vitals. `commercial_use` on these is
            inferred from the licence tag, not read from the licence: check any
            row rendered with a trailing `?` before merging.

            **`candidates.yaml`** — rows that need a decision. Each carries a
            `needs_review` list saying what is missing. Fill the gap here and the
            next run promotes the row automatically.
          add-paths: |
            models.yaml
            candidates.yaml
            arena_agent_rankings.yaml
            aa_scores.yaml
            README.md
          delete-branch: true
